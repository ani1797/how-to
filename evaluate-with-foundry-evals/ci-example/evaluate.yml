# Example CI workflow for automated GenAI evaluation.
#
# NOTE: This file lives under the workshop's ci-example/ folder on purpose.
# It is a *reference* — it is NOT under .github/workflows/, so it will not run
# in this repository. To use it, copy it into your own repo's
# .github/workflows/ directory and wire up the secrets below.
#
# Docs: https://github.com/marketplace/actions/generative-ai-evaluation-action

name: GenAI Evaluation

on:
  # Avoid running on every commit to control cost — gate on relevant paths / PRs.
  pull_request:
    paths:
      - "prompts/**"
      - "evaluate-with-foundry-evals/ci-example/eval-input.jsonl"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      GENAI_EVALS_CONFIG_PATH: ${{ github.workspace }}/evaluate-with-foundry-evals/ci-example/evaluate-config.json
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
    steps:
      - uses: actions/checkout@v4

      # OIDC login — no long-lived credentials stored in the repo.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.OIDC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OIDC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OIDC_AZURE_SUBSCRIPTION_ID }}

      - name: Run AI Evaluation
        id: run-ai-evaluation
        uses: microsoft/genai-evals@main
        with:
          evaluate-configuration: ${{ env.GENAI_EVALS_CONFIG_PATH }}

      # Evaluation results are written to the Actions job summary automatically.
